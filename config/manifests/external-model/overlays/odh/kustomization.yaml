apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Controller-owned overlay: combines the pinned upstream ExtProc manifests
# with the ExternalModel-only Envoy filter. The upstream tree remains fully
# reproducible under config/manifests/praxis-extproc/.
resources:
  - ../../../praxis-extproc/overlays/odh
  - external-model-envoy-filter.yaml

# Keep the vendored ExtProc manifest identical to its pinned upstream commit.
# The four post-auth insertion patches cover the supported RHCL/Istio anchors.
# Shared Anthropic-client SSE translation needs response chunks as they arrive.
patches:
  - target:
      group: networking.istio.io
      version: v1alpha3
      kind: EnvoyFilter
      name: payload-processing
    patch: |-
      - op: replace
        path: /spec/configPatches/1/patch/value/typed_config/processing_mode/response_body_mode
        value: STREAMED
      - op: replace
        path: /spec/configPatches/3/patch/value/typed_config/processing_mode/response_body_mode
        value: STREAMED
      - op: replace
        path: /spec/configPatches/5/patch/value/typed_config/processing_mode/response_body_mode
        value: STREAMED
      - op: replace
        path: /spec/configPatches/7/patch/value/typed_config/processing_mode/response_body_mode
        value: STREAMED
