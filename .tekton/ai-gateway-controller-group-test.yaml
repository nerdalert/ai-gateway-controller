---
apiVersion: tekton.dev/v1
kind: PipelineRun
metadata:
  annotations:
    build.appstudio.openshift.io/repo: https://github.com/opendatahub-io/ai-gateway-controller?rev={{revision}}
    build.appstudio.redhat.com/commit_sha: '{{revision}}'
    build.appstudio.redhat.com/target_branch: '{{target_branch}}'
    build.appstudio.redhat.com/pull_request_number: '{{pull_request_number}}'
    pipelinesascode.tekton.dev/cancel-in-progress: "false"
    pipelinesascode.tekton.dev/max-keep-runs: "3"
    pipelinesascode.tekton.dev/on-cel-expression: event == "group-test" || (event ==
      "pull_request" && target_branch == "main")
    pipelinesascode.tekton.dev/on-comment: "^/group-test"
  name: ai-gateway-controller-group-test
  namespace: open-data-hub-tenant
  labels:
    appstudio.openshift.io/application: group-testing
    appstudio.openshift.io/component: ai-gateway-controller-group
    pipelines.appstudio.openshift.io/type: test
spec:
  params:
  - name: group-components
    value: '{ "odh-ai-gateway-controller-ci": "opendatahub/odh-ai-gateway-controller" }'
  - name: praxis-extproc-image
    value: quay.io/opendatahub/odh-praxis-extproc@sha256:0acefdc2793849ca4728be3d56702150caa36d09773ebdf724190d2fd20a2002
  pipelineRef:
    resolver: git
    params:
    - name: url
      value: '{{source_url}}'
    - name: revision
      value: '{{revision}}'
    - name: pathInRepo
      value: hack/tekton/pr-group-testing-pipeline.yaml
  taskRunTemplate:
    podTemplate:
      nodeSelector:
        konflux-ci.dev/workload: konflux-tenants
      tolerations:
      - effect: NoSchedule
        key: konflux-ci.dev/workload
        operator: Equal
        value: konflux-tenants
    serviceAccountName: konflux-integration-runner
  timeouts:
    pipeline: 4h0m0s
    tasks: 3h
  workspaces:
  - name: git-auth
    secret:
      secretName: '{{ git_auth_secret }}'
