---
apiVersion: tekton.dev/v1
kind: PipelineRun
metadata:
  annotations:
    build.appstudio.openshift.io/repo: https://github.com/opendatahub-io/ai-gateway-controller?rev={{revision}}
    build.appstudio.redhat.com/commit_sha: '{{revision}}'
    build.appstudio.redhat.com/target_branch: '{{target_branch}}'
    build.appstudio.redhat.com/pull_request_number: '{{pull_request_number}}'
    pipelinesascode.tekton.dev/cancel-in-progress: "false"
    pipelinesascode.tekton.dev/max-keep-runs: "3"
    pipelinesascode.tekton.dev/on-cel-expression: event == "group-test" || (event ==
      "pull_request" && target_branch == "main")
    pipelinesascode.tekton.dev/on-comment: "^/group-test"
  name: ai-gateway-controller-group-test
  namespace: open-data-hub-tenant
  labels:
    appstudio.openshift.io/application: group-testing
    appstudio.openshift.io/component: ai-gateway-controller-group
    pipelines.appstudio.openshift.io/type: test
spec:
  params:
  - name: group-components
    value: '{ "odh-ai-gateway-controller-ci": "opendatahub/odh-ai-gateway-controller" }'
  - name: praxis-extproc-image
    value: quay.io/opendatahub/odh-praxis-extproc@sha256:1ad87bba6bf06738064552f45ff9f492952d30ba1be115461ae2af9f4c069658
  - name: aigc-controller-image
    value: quay.io/opendatahub/odh-ai-gateway-controller@sha256:1e649f4ac8c7083639b08cc5ba2c650f4a23cfcabc9a19fb7d955548e0a7df35
  - name: maas-api-image
    value: quay.io/opendatahub/maas-api@sha256:8f20438ed20c69579d86d52be92abe19c54c5a6629d947994d95eb79bafe87de
  - name: maas-controller-image
    value: quay.io/opendatahub/maas-controller@sha256:6538317db1b7324eb3daeb413c609c7fdc31f5d9896a29363c1d5a300c3441ff
  - name: e2e-test-filter
    value: test_multiple_distinct_models_in_subscription
  - name: e2e-parallel-workers
    value: '1'
  - name: models-listing-diagnostics
    value: 'true'
  pipelineRef:
    resolver: git
    params:
    - name: url
      value: '{{source_url}}'
    - name: revision
      value: '{{revision}}'
    - name: pathInRepo
      value: hack/tekton/pr-group-testing-pipeline.yaml
  taskRunTemplate:
    podTemplate:
      nodeSelector:
        konflux-ci.dev/workload: konflux-tenants
      tolerations:
      - effect: NoSchedule
        key: konflux-ci.dev/workload
        operator: Equal
        value: konflux-tenants
    serviceAccountName: konflux-integration-runner
  timeouts:
    pipeline: 4h0m0s
    tasks: 3h
  workspaces:
  - name: git-auth
    secret:
      secretName: '{{ git_auth_secret }}'
